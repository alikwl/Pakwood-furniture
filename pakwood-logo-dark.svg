<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C383"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A88434"/>
    </linearGradient>
  </defs>

  <!-- Architectural Timber Emblem -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Diamond Harmony -->
    <rect x="5" y="5" width="50" height="50" rx="4" transform="rotate(45 30 30)" fill="none" stroke="url(#goldGradDark)" stroke-width="1.75" opacity="0.45"/>
    <rect x="11" y="11" width="38" height="38" rx="2" transform="rotate(45 30 30)" fill="#181513" stroke="url(#goldGradDark)" stroke-width="2"/>
    
    <!-- Interlocking Wood Joinery Motif -->
    <path d="M 23 18 L 23 42 M 23 18 L 34 18 C 38 18 40 21 40 25 C 40 29 38 32 34 32 L 23 32" fill="none" stroke="#FAF8F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 27 34 L 31 42 L 35 34 L 39 42" fill="none" stroke="url(#goldGradDark)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Points -->
    <circle cx="30" cy="8" r="2" fill="url(#goldGradDark)"/>
    <circle cx="30" cy="52" r="2" fill="url(#goldGradDark)"/>
  </g>

  <!-- Typography -->
  <text x="88" y="44" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="5" fill="#FAF8F5">
    PAKWOOD
  </text>
  
  <text x="90" y="62" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9.5" font-weight="600" letter-spacing="5.5" fill="#E5C383">
    FURNITURE
  </text>
  <circle cx="218" cy="59" r="1.75" fill="#A88434"/>
  <text x="232" y="62" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9" font-weight="500" letter-spacing="4" fill="#A8A39D">
    MULTAN • EST. 1988
  </text>
</svg>
