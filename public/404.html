<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pakwood Furniture — Premium Home & Office Furniture in Pakistan</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirect Script (Custom Domain pakwoodfurniture.store)
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var newPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var newSearch = l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        newPath + newSearch + l.hash
      );
    </script>
  </head>
  <body style="background-color: #FAF8F5; margin: 0; padding: 0; font-family: sans-serif;">
  </body>
</html>
